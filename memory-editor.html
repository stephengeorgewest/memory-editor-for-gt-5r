<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#153b32">
  <title>Memory Editor for Baofeng GT-5R</title>
  <script>
    const GT5R_DTCS = [23, 25, 26, 31, 32, 36, 43, 47, 51, 53, 54, 65, 71, 72, 73, 74, 114, 115, 116, 122, 125, 131, 132, 134, 143, 145, 152, 155, 156, 162, 165, 172, 174, 205, 212, 223, 225, 226, 243, 244, 245, 246, 251, 252, 255, 261, 263, 265, 266, 271, 274, 306, 311, 315, 325, 331, 332, 343, 346, 351, 356, 364, 365, 371, 411, 412, 413, 423, 431, 432, 445, 446, 452, 454, 455, 462, 464, 465, 466, 503, 506, 516, 523, 526, 532, 546, 565, 606, 612, 624, 627, 631, 632, 645, 654, 662, 664, 703, 712, 723, 731, 732, 734, 743, 754];
    const GT5R_CHANNEL_COUNT = 128;
    const GT5R_BAUD_RATE = 9600;

    // 
    // Table headers for the memory editor
    // header[0] is only used in csv import/export
    const headers = ['Location', 'Name', 'Frequency', 'Duplex', 'Offset', 'Tone', 'rToneFreq', 'cToneFreq', 'DtcsCode', 'DtcsPolarity', 'RxDtcsCode', 'CrossMode', 'Mode', 'TStep', 'Skip', 'Power', 'Comment'];

    // Choices for select fields in the memory editor
    const choices = { Duplex: ['', '+', '-', 'split', 'off'], Tone: ['', 'Tone', 'TSQL', 'DTCS', 'DTCS-R', 'Cross'], DtcsPolarity: ['NN', 'NR', 'RN', 'RR'], CrossMode: ['Tone->Tone', 'Tone->DTCS', 'DTCS->Tone', 'DTCS->DTCS'], Mode: ['FM', 'NFM', 'AM', 'WFM', 'USB', 'LSB', 'DV'], Skip: ['', 'S'] };
    
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[character]);
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');

    :root {
      color-scheme: light dark;
      --ink: light-dark(#17211d, #e6eee4);
      --forest: light-dark(#153b32, #0d231e);
      --forest-light: light-dark(#315844, #244c3d);
      --leaf: light-dark(#4c7858, #9bc49a);
      --leaf-bright: light-dark(#b6d58e, #c8e899);
      --accent: light-dark(#c6e17b, #c5e77d);
      --paper: light-dark(#f8faf4, #1b2822);
      --canvas: light-dark(#e8eee6, #101914);
      --panel: light-dark(#e1eadb, #26382d);
      --panel-soft: light-dark(#edf4e9, #203127);
      --line: light-dark(#b3c0ae, #405548);
      --line-soft: light-dark(#dce4d8, #304238);
      --button: light-dark(#dbe7d1, #2d4939);
      --muted: light-dark(#607568, #a7b9a8);
      --cream: light-dark(#f5f3e8, #edf4e8);
      --rust: light-dark(#8c5b4d, #e09a81);
      --subtitle: light-dark(#ccdbca, #c0d0c0);
      --status: light-dark(#d8e2ce, #c6d8c6);
      --border: light-dark(#acb9a9, #52695a);
      --focus: light-dark(#c6dcab, #7ea77d);
      --button-border: light-dark(#5f8065, #6f9977);
      --button-ink: light-dark(#234731, #e1efe1);
      --strong: light-dark(#1e5b3c, #b9e1ae);
      --notice: light-dark(#45774d, #a8d5a5);
      --shadow: light-dark(#cbd7c8, #0a100d);
      --heading-ink: light-dark(#4c6652, #c3d7c4);
      --readonly: light-dark(#78917a, #91ad94);
      --tertiary-border: light-dark(#c6d0c0, #536a5a);
      --tertiary-hover: light-dark(#f2e3dc, #49302a);
      --tertiary-hover-border: light-dark(#b98777, #d0836e);
      --empty: light-dark(#718275, #9caf9d);
      color: var(--ink);
      background: var(--canvas);
      font-family: 'DM Mono', monospace;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
    }

    .masthead {
      align-items: end;
      background: var(--forest);
      color: var(--cream);
      display: flex;
      gap: 2rem;
      justify-content: space-between;
      padding: 0.5em;
    }

    .kicker {
      color: var(--leaf-bright);
      font-size: .7rem;
      letter-spacing: .17em;
      margin: 0 0 .75rem;
      text-transform: uppercase;
    }

    h1 {
      font-family: Fraunces, Georgia, serif;
      letter-spacing: -.04em;
      line-height: .9;
      margin: 0;
    }

    .subtitle {
      color: var(--subtitle);
      font-size: .82rem;
      line-height: 1.6;
      margin: 1.15rem 0 0;
      max-width: 32rem;
    }

    .file-status {
      align-items: center;
      color: var(--status);
      display: flex;
      font-size: .72rem;
      gap: .6rem;
      padding-bottom: .25rem;
    }

    .dot {
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 0 4px var(--forest-light);
      display: inline-block;
      height: .5rem;
      width: .5rem;
    }

    main {
      margin: 0 auto;
      padding: 0.5em;
    }

    .toolbar {
      align-items: end;
      display: flex;
      gap: 1rem;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    .toolbar>div:first-child {
      flex-grow: 1;
    }

    .search {
      color: var(--muted);
      display: flex;
      flex: 1;
      flex-direction: column;
      font-size: .68rem;
      gap: .5rem;
      letter-spacing: .08em;
      max-width: 32rem;
      text-transform: uppercase;
    }

    .search div {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .search input {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 0;
      color: var(--ink);
      font: inherit;
      letter-spacing: 0;
      padding: .85rem 1rem;
      text-transform: none;
      width: 100%;
    }

    .search input:focus,
    input:focus,
    select:focus {
      border-color: var(--leaf);
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: .55rem;
    }

    button, label.button {
      border: 1px solid var(--button-border);
      cursor: pointer;
      font: 500 .72rem 'DM Mono', monospace;
      padding: .85rem 1rem;
    }

    button[disabled] {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .primary {
      background: var(--forest);
      color: var(--cream);
    }

    .secondary {
      background: var(--button);
      color: var(--button-ink);
    }

    .tertiary {
      background: transparent;
      border-color: var(--tertiary-border);
      color: var(--rust);
      font-size: .68rem;
      padding: .35rem .5rem;
    }

    .tertiary:hover {
      background: var(--tertiary-hover);
      border-color: var(--tertiary-hover-border);
    }

    button:hover:not(:disabled) {
      filter: brightness(1.17);
    }

    @media (prefers-color-scheme: dark) {
      button:hover:not(:disabled) {
        filter: brightness(0.83);
      }
    }

    .summary {
      color: var(--muted);
      font-size: .74rem;
      margin-bottom: 0rem;
    }

    .summary strong {
      color: var(--strong);
      font-size: 1rem;
    }

    #notice {
      color: var(--notice);
      margin-left: 1rem;
    }

    .grid-shell {
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: 6px 6px 0 var(--shadow);
      overflow: auto;
    }

    table {
      border-collapse: collapse;
      min-width: 1240px;
      width: 100%;
    }

    th,
    td {
      border-bottom: 1px solid var(--line-soft);
      padding: .7rem .8rem;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: var(--panel);
      color: var(--heading-ink);
      font-size: .64rem;
      font-weight: 500;
      letter-spacing: .08em;
      position: sticky;
      text-transform: uppercase;
      top: 0;
      z-index: 1;
    }
    th.action div{
      position: relative;
    }
    th.action div div#copy-options-container{
      position:absolute;
      right: 0;
      display:none;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: .5rem;
    }
    th.action div div#copy-options-container[open] {
      display: flex;
    }
    td {
      font-size: .76rem;
    }

    tr.hidden {
      display: none;
    }

    tr[row-selected] td {
      background: var(--canvas);
      font-weight:bolder;
      color: var(--heading-ink);
    }
    tr[row-selected] td:first-child, tr[row-selected] td:last-child {
      background: var(--paper);
    }

    .channel,
    .action {
      background: var(--panel-soft);
      color: var(--leaf);
      font-weight: 500;
      position: sticky;
    }

    .channel {
      width: 4em;
      left: 0;
    }

    .action {
      width: 16em;
      right: 0;
    }

    th.channel {
      z-index: 3;
    }

    td input,
    td select {
      background: transparent;
      border: 0;
      border-bottom: 1px solid transparent;
      color: inherit;
      font: inherit;
      min-width: 5.2rem;
      padding: .25rem .15rem;
      width: 100%;
    }

    td input[readonly] {
      color: var(--readonly);
      cursor: not-allowed;
    }

    input[type="checkbox"], label:has(select) {
      cursor: pointer;
      accent-color: var(--leaf);
    }

    label:has(> input[type="checkbox"]) {
      display: flex;
      align-items: center;
      cursor: pointer;
      gap: .3rem;
    }

    td select {
      min-width: 5.8rem;
    }

    #read-serial {
      --progress: 0%;
      background-image: linear-gradient(to right, var(--leaf-bright) var(--progress), transparent var(--progress));
      background-repeat: no-repeat;
      position: relative;
    }

    #read-serial[disabled] {
      cursor: progress;
      color: var(--button-border);
    }

    #copy-all[disabled],
    #copy-selected[disabled] {
      display: none;
    }

    .empty {
      color: var(--empty);
      padding: 4rem;
      text-align: center;
    }

    .table-section {
      margin-top: 2.5rem;
    }

    .table-heading {
      align-items: end;
      display: flex;
      justify-content: space-between;
      margin-bottom: .85rem;
    }

    .table-heading h2 {
      color: var(--heading-ink);
      font-family: Fraunces, Georgia, serif;
      font-size: 1.35rem;
      margin: 0;
    }

    .table-heading p {
      color: var(--muted);
      font-size: .7rem;
      margin: .35rem 0 0;
    }

    .source-shell {
      box-shadow: 6px 6px 0 var(--shadow);
    }

    .source-shell td {
      color: var(--muted);
    }

    .source-shell .channel,
    .source-shell .action {
      color: var(--leaf);
    }

    select {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 0;
      color: var(--ink);
      font: inherit;
      padding: .35rem 0.25rem;
    }

    label:has(:focus) {
      border-color: var(--leaf);
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    .serial-log {
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: 6px 6px 0 var(--shadow);
      color: var(--muted);
      font-size: .75rem;
      font-family: 'DM Mono', monospace;
      line-height: 1.5;
      margin-top: 2.5rem;
      max-height: 20rem;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .serial-log div {
      padding:1rem;
      margin-bottom: -.5rem;
    }

    .serial-log div:first-child {
      position:sticky;
      top: 0;
      background-color: var(--panel);
    }

    @media (max-width: 700px) {
      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        width: 100%;
      }

      .button {
        flex: 1;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <header class="masthead">
    <div>
      <p class="kicker">A small</p>
      <h1>Memory editor</h1>
      <p class="subtitle">for Baofeng GT-5R radio.</p>
    </div>
    <button id="theme" class="secondary" type="button">Theme: auto</button>
  </header>
  <main>
    <section class="table-section">
      <div class="table-heading">
        <div>
          <h2>Main memory</h2>
          <p id="memory-status" role="status">Editable channels ready for export.</p>
        </div>
      </div>
      <section class="toolbar">
        <div>
          <label class="search">
            <div>Filter channels<section class="summary"><strong id="visible-count">0</strong> visible of <span
                  id="total-count"><script>document.write(GT5R_CHANNEL_COUNT);</script></span> channels</div>
            <input id="filter" placeholder="name, frequency, comment">
          </label>
          <label><input id="hide-empty" type="checkbox">Hide empty channels</label>
        </div>

        <div class="actions">
          <button id="export" class="primary">Export CSV</button>
          <button id="write-serial" class="primary" disabled>Write to GT-5R</button>
        </div>
      </section>
      <section class="grid-shell">
        <table>
          <thead>
            <tr>
              <th class="channel">#</th>
              <script>
                headers.slice(1).forEach((header) => {
                  document.write(`<th>${header}</th>`);
                });
              </script>
              <th class="action"></th>
            </tr>
          </thead>
          <tbody id="table-body">
            <script>

const tbody = document.querySelector('#table-body');

Array(GT5R_CHANNEL_COUNT).fill().map((_, i) => {
  const row = document.createElement('tr');
  row.setAttribute('data-location', i);

  const channelTD = document.createElement('td');
  channelTD.className = 'channel';
  channelTD.textContent = i;
  row.appendChild(channelTD);

  headers.slice(1).forEach((header) => {
    const td = document.createElement('td');
    td.innerHTML = choices[header]
      ? `<select data-field="${header}">${choices[header].map((choice) => `
          <option value="${choice}">${escapeHtml(choice) || 'none'}</option>`).join('')}
        </select>`
      : `<input data-field="${header}" type="text">`;
      
    row.appendChild(td);
  });
  
  const actionTD = document.createElement('td');
  actionTD.className = 'action';
  actionTD.innerHTML = `<button class="tertiary" data-action="clear" title="Clear channel">Clear</button>`;
  row.appendChild(actionTD);
  tbody.appendChild(row);
});

const visibleChannels = () => {
const hideEmpty = document.getElementById('hide-empty').checked;
const query = document.getElementById('filter').value.trim().toLowerCase();
let visible = 0;
  document.querySelectorAll('[data-location]').forEach((row) => {
    const isMatchingChannel = !query || row.dataset.location.toLowerCase().includes(query);

    const dataFields = row.querySelectorAll("[data-field]");
    const allEmptyFields = hideEmpty && Array.from(dataFields).every((field) => {
      const defaultValue = choices[field.dataset.field]?.[0] ?? '';
      return field.value === defaultValue;
    });
    const hasMatchingField = !query || Array.from(dataFields).some((field) => {
      return field.value.toLowerCase().includes(query);
    });
    if ((isMatchingChannel || hasMatchingField) && !allEmptyFields) {
      row.classList.remove('hidden');
      visible += 1;
    } else {
      row.classList.add('hidden');
    }
  });
  document.querySelector('#visible-count').textContent = visible;
};
            </script>
          </tbody>
        </table>
      </section>
    </section>

    <section class="table-section">
      <div class="table-heading">
        <div>
          <h2>Imported</h2>
          <p id="source-status">Import a CSV, or read from device to preview read-only channels here.</p>
        </div>
        <div class="actions">
          <label class="button secondary">Import CSV<input id="import" type="file" accept=".csv,text/csv"
              hidden></label>
          <button id="read-serial" class="secondary" type="button">Read from GT-5R</button>
        </div>
      </div>
      <section class="grid-shell source-shell">
        <table>
          <thead>
            <tr>
              <th class="channel">#</th>
              <script>
                headers.slice(1).forEach(header => {
                  document.write(`<th>${header}</th>`);
                });
              </script>
              <th class="action"><div>
                <button id="copy-all" class="tertiary" type="button" disabled>Copy all</button>
                <button id="copy-selected" class="tertiary" type="button" disabled>Copy selected</button>
                <button id="copy-options" class="tertiary" title="Copy Options">⌥</button>
                <div id="copy-options-container">
                  <label><select id="copy-destination">
                    <option value="">--</option>
                    <script>document.addEventListener('DOMContentLoaded', function() {
                      const copyDestination = document.querySelector('#copy-destination');
                      for (let channel = 0; channel < GT5R_CHANNEL_COUNT; channel++) {
                        copyDestination.add(new Option(channel, channel));
                      }
                      copyDestination.value = '';
                    });</script>
                  </select> Copy Destination</label>
                  <label title="Copy selected channels without gaps"><input type="checkbox" id="copy-contiguously" /> Copy contiguously</label>
                </div></div>
              </th>
            </tr>
          </thead>
          <tbody id="source-body">
            <tr>
              <td class="empty" colspan="18">No CSV imported.</td>
            </tr>
          </tbody>
        </table>
      </section>
    </section>

    <section class="table-section">
      <div class="table-heading">
        <div>
          <h2>Serial Log</h2>
          <p>Displays the log of serial communication with the device.</p>
        </div>
        <div><select id="select-serial-log"></select></div>
      </div>
      <div id="serial-logs-container"></div>
    </section>
  </main>
  <script>
    const makeMemory = (values) => Object.assign({ Location: '', Name: '', Frequency: '', Duplex: '', Offset: '', Tone: '', rToneFreq: '', cToneFreq: '', DtcsCode: '', DtcsPolarity: 'NN', RxDtcsCode: '', CrossMode: 'Tone->Tone', Mode: 'FM', TStep: '', Skip: '', Power: '', Comment: '' }, values || {});
   
    // TODO: use byte array to visually represent memory contents
    let memories = [];

    let sourceMemories = [];
    let fileName = 'chirp-export.csv';
    let theme = localStorage.getItem('chirp-theme') || 'auto';


    function render() {
      document.querySelector('#source-body').innerHTML = sourceMemories.length ? sourceMemories.map((memory, index) => `<tr imported-location="${memory.Location}"><td class="channel">${memory.Location}</td>${headers.slice(1).map((header) => `<td>${escapeHtml(memory[header])}</td>`).join('')}<td class="action"><button class="tertiary" data-action="copy" data-source-index="${index}" title="Copy channel to main">Copy</button></td></tr>`).join('') : '<tr><td class="empty" colspan="18">No CSV imported.</td></tr>';
      document.querySelector('#copy-all').disabled = sourceMemories.length === 0;
      document.querySelectorAll('[imported-location]').forEach((cell) => cell.addEventListener('click', importedLocationClick));
      document.querySelectorAll('[data-field]').forEach((control) => control.addEventListener('change', updateMemory));
      document.querySelectorAll('[data-action="clear"]').forEach((button) => button.addEventListener('click', clearChannel));
      document.querySelectorAll('[data-action="copy"]').forEach((button) => button.addEventListener('click', copySource));
    }

    function bindEvents() {
      document.querySelector('#theme').addEventListener('click', cycleTheme);

      document.querySelector('#filter').addEventListener('input', visibleChannels);
      document.querySelector('#hide-empty').addEventListener('change', visibleChannels);

      document.querySelector('#export').addEventListener('click', downloadCsv);
      // document.querySelector("#write-serial").addEventListener('click', writeSerial);

      document.querySelector('#import').addEventListener('change', importCsv);
      document.querySelector('#copy-all').addEventListener('click', copyAllSources);
      document.querySelector('#copy-selected').addEventListener('click', copySelectedSources);

      document.querySelector('#copy-options').addEventListener('click', () => {
        const container = document.querySelector('#copy-options-container');
        container.hasAttribute("open") ? container.removeAttribute("open") : container.setAttribute("open", "");
      });
      document.querySelector("label:has(#copy-destination)").addEventListener('click', (event) => {
        /*prevent default prevents

        index.html:653 Uncaught NotAllowedError: Failed to execute 'showPicker' on 'HTMLSelectElement': showPicker() requires a user gesture.
    at HTMLLabelElement.<anonymous> (index.html:653:53)
(anonymous) @ index.html:653
index.html:653 Uncaught NotAllowedError: Failed to execute 'showPicker' on 'HTMLSelectElement': showPicker() requires a user gesture.
    at HTMLLabelElement.<anonymous> (index.html:653:53)
(anonymous) @ index.html:653

but also prevents focus;

I guess just let the error happen.*/
        //event.preventDefault();
        //this.focus();
        //document.querySelector("label:has(#copy-destination)")
        document.getElementById('copy-destination').showPicker();
      });

      const readSerialButton = document.querySelector('#read-serial');
      if (!('serial' in navigator)) { readSerialButton.disabled = true; readSerialButton.title = 'Web Serial API is not available in this browser (try Chrome or Edge).'; }
      else readSerialButton.addEventListener('click', readFromGt5r);
      document.querySelector('#select-serial-log').addEventListener('change', (event) => {
        const index = Number(event.target.value);
        showSerialLog(index);
      });
    }
    function showSerialLog(index) {
      const serialLogsContainer = document.querySelector('#serial-logs-container');
      serialLogsContainer.childNodes.forEach((node, i) => { node.style.display = i === index ? 'block' : 'none'; });
    }

    //todo store memory in byte array for display/export
    function findMemory(location) {
      return memories.find((memory) => memory.Location === location);
    }

    function updateMemory(event) {
      const control = event.target;
      const row = control.closest('tr');
      const memory = findMemory(row.dataset.location);
      if (memory) {
        memory[control.dataset.field] = control.value;
        showStatus('Channel updated'); }
    }

    function copyMemory(memory) {
      const existing = Array.from(document.querySelectorAll('#table-body tr')).find((item) => item.dataset.location === memory.Location);

      if (existing) {
        existing.childNodes.forEach((node, i) => {
          node.childNodes[0].value = memory[headers[i]];
        });
      } 
    }

    function copySource(event) {
      //don't bubble event to the TR select row click event
      event.stopPropagation();

      const copy = makeMemory({ ...sourceMemories[Number(event.target.dataset.sourceIndex)] });
      const startingAt = document.getElementById('copy-destination').value;
      
      if(startingAt) copy.Location = startingAt;

      copyMemory(copy);

      visibleChannels();
      showStatus('Channel copied to main', '#memory');
    }

    function copyAllSources() {
      const startingAt = document.getElementById('copy-destination').value;
      const firstSelected = sourceMemories[0].Location;
      const startingIndex = startingAt === "" 
        ? Number(firstSelected)
        : Number(startingAt);
      const copyContigious = document.getElementById('copy-contiguously').checked;

      sourceMemories.forEach((memory, i) => {
        const newLocation = copyContigious 
          ? startingIndex + i 
          : startingIndex + Number(memory.Location) - Number(firstSelected);
        if(newLocation < GT5R_CHANNEL_COUNT){
          copyMemory({...makeMemory({ ...memory, Location: String(newLocation) })});
        } else {
          console.log(`skipping ${memory.Location} because it exceeds the channel count`);
        }
      });

      visibleChannels();
      showStatus(`${sourceMemories.length} channels copied to main`, '#memory');
    }

    function copySelectedSources() {
      const selectedRows = [...document.querySelectorAll('[row-selected]')].map(row => row.getAttribute('imported-location'));
      if(selectedRows.length === 0) return;

      const firstSelected = selectedRows[0];
      const startingAt = document.getElementById('copy-destination').value || selectedRows[0];
      const startingIndex = startingAt === "" ? Number(firstSelected) : Number(startingAt);

      const selectedMemories = sourceMemories.filter((memory) => selectedRows.includes(memory.Location));
      
      // if selected range 2,3,4,7,8,9 starting at 0 => then we copy 2to0 3to1 4to2 7to3 8to4 9to5
      const copyContigious = document.getElementById('copy-contiguously').checked;

      selectedMemories.forEach((memory, i) => {
        let newLocation = copyContigious 
          ? startingIndex + i 
          : startingIndex + Number(memory.Location) - Number(firstSelected);

        if(newLocation < GT5R_CHANNEL_COUNT){
          copyMemory({...makeMemory({ ...memory, Location: String(newLocation) })});
        } else {
          console.log(`skipping ${memory.Location} because it exceeds the channel count`);
        }
      });

      visibleChannels();
      showStatus(`${selectedRows.length} channels copied to main`, '#memory');
    }
    
    function clearChannel(event) {
      const row = event.target.closest('tr');
      const fields = row.querySelectorAll('[data-field]');
      for(const field of fields) {
        const dataField = field.dataset.field;
        field.value = choices[dataField]?.[0] ?? '';
      }

      visibleChannels();
      showStatus('Channel cleared', '#memory');
    }

    function showStatus(message, section = '#memory') {
      const notice = document.querySelector(section + "-status");
      notice.textContent = message;
    }
    
    function applyTheme() {
      document.documentElement.style.colorScheme = theme === 'auto' ? 'light dark' : theme;
      document.querySelector('#theme').textContent = `Theme: ${theme}`;
    }
    
    function cycleTheme() {
      theme = theme === 'auto' ? 'light' : theme === 'light' ? 'dark' : 'auto'; localStorage.setItem('chirp-theme', theme); applyTheme();
    }

    function downloadCsv() {
      const csvValue = (value) => /[",\n]/.test(value) ? `"${value.replaceAll('"', '""')}"` : value;
      const content = [
        headers.join(','),
        ...memories.map((memory) => headers.map((header) => csvValue(memory[header])).join(','))
      ].join('\n') + '\n';

      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([content], { type: 'text/csv;charset=utf-8' }));
      link.download = fileName; link.click();
      URL.revokeObjectURL(link.href); 
      showStatus('CSV exported', '#memory');
    }

    function parseCsv(text) {
      const rows = []; let row = [], cell = '', quoted = false;
      for (let index = 0; index < text.length; index += 1) {
        const character = text[index];
        if (character === '"' && text[index + 1] === '"' && quoted) { cell += '"'; index += 1; }
        else if (character === '"') quoted = !quoted;
        else if (character === ',' && !quoted) { row.push(cell); cell = ''; }
        else if ((character === '\n' || character === '\r') && !quoted) { if (character === '\r' && text[index + 1] === '\n') index += 1; row.push(cell); if (row.some(Boolean)) rows.push(row); row = []; cell = ''; }
        else cell += character;
      }
      if (cell || row.length) { row.push(cell); rows.push(row); }
      const headerRow = rows.findIndex((candidate) => candidate.includes('Location'));
      if (headerRow < 0) throw new Error('This file does not contain a CHIRP CSV header.');
      const sourceHeaders = rows[headerRow];
      return rows.slice(headerRow + 1).map((values) => makeMemory(Object.fromEntries(headers.map((header) => { const sourceIndex = sourceHeaders.indexOf(header); return [header, sourceIndex >= 0 ? values[sourceIndex] || '' : '']; })))).filter((memory) => memory.Frequency || memory.Name);
    }
    
    function importCsv(event) {
      const file = event.target.files[0];
      if (!file) return;
      file.text().then((text) => {
        sourceMemories = parseCsv(text);
        document.querySelector('#source-status').textContent = `${sourceMemories.length} read-only channels from ${file.name}`;
        fileName = file.name.replace(/\.csv$/i, '') + '-edited.csv';
        render();
        showStatus(`${sourceMemories.length} channels ready to copy`, '#memory');
      }).catch((error) => showStatus(error.message, '#memory'));
    }

    function importedLocationClick(event) {
      // td gets the click event for some reason
      const tr = event.target.parentElement;
      rowSelected = tr.attributes['row-selected'];
      if(event.altKey){
        if(rowSelected !== undefined){
          tr.removeAttribute('row-selected');
        } else {
          const selectedRows = Array.from(document.querySelectorAll('[row-selected]')).map((tr) => parseInt(tr.getAttribute('row-selected')) || 0);
          const nextRowSelected = Math.max(...selectedRows) + 1;
          tr.setAttribute('row-selected', nextRowSelected);
        }
      } else if(event.shiftKey){
        const selectedRows = document.querySelectorAll('[row-selected]');
        const selectedRowsNumbers = Array.from(selectedRows).map((tr) => parseInt(tr.getAttribute('row-selected')) || 0);
        const currentRowSelectedNumber = selectedRows.length ? Math.max(...selectedRowsNumbers) : 0;
        tr.setAttribute('row-selected', currentRowSelectedNumber + 1);

        let oldFound = false;
        let newFound = false;
        document.querySelectorAll("#source-body tr").forEach((row) => {
          const selectedNumber = parseInt(row.getAttribute('row-selected'));
          if(selectedNumber === currentRowSelectedNumber){
            oldFound = true;
            return;
          }
          if(selectedNumber === currentRowSelectedNumber + 1){
            newFound = true;
            return;
          }

          if(oldFound && newFound) return;
          
          if(oldFound || newFound){
            row.setAttribute('row-selected', currentRowSelectedNumber);
          }
        });
      } else {
        document.querySelectorAll('[row-selected]').forEach((tr) => tr.removeAttribute('row-selected'));
        tr.setAttribute('row-selected', '1');
      }

      if(document.querySelectorAll('[row-selected]').length === 0){
        document.getElementById('copy-all').disabled = false;
        document.getElementById('copy-selected').disabled = true;
      } else {
        document.getElementById('copy-all').disabled = true;
        document.getElementById('copy-selected').disabled = false;
      }
    }


    // --- GT-5R (Baofeng UV-5R family) serial clone protocol, ported from chirp/drivers/uv5r.py ---

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));


    async function readFromGt5r() {
      if (!('serial' in navigator)) { showStatus('Web Serial API is not available in this browser.', "#source"); return; }
      let port;
      try { port = await navigator.serial.requestPort(); }
      catch (error) { return; } // user cancelled the port picker
      const readSerialButton = document.querySelector('#read-serial');
      try {
        const byteReader = new SerialByteReaderWriterWithLogger(port);
        await byteReader.open();
        showStatus('Reading from GT-5R\u2026', "#source");
        readSerialButton.disabled = true;
        readSerialButton.style.setProperty('--progress', '0%');

        const data = await gt5rDownload(byteReader, (done, total) => {
          // TODO: can we parse data as we download it?
          const progress = Math.round((done / total) * 100);
          showStatus(`Reading from GT-5R\u2026 ${progress}%`, "#source");
          readSerialButton.style.setProperty('--progress', `${progress}%`);
        });
        sourceMemories = gt5rParseImage(data);
        showStatus(`${sourceMemories.length} read-only channels read from GT-5R`, "#source");
        fileName = 'gt5r-read.csv';
        render();
        showStatus(`${sourceMemories.length} channels read from GT-5R`, "#source");
      } catch (error) {
        showStatus(error.message || 'Failed to read from radio', "#source");
      } finally {
        try { await port.close(); } catch (error) { /* already closed */ }
        readSerialButton.disabled = false;
        readSerialButton.style.setProperty('--progress', '0%');
      }
    }

    class SerialByteReaderWriterWithLogger {
      constructor(port) {
        this.port = port;
      }

      async open() {
        await this.port.open({ baudRate: GT5R_BAUD_RATE });
        this.addSerialLog(`Opened port ${this.port.getInfo().usbVendorId}:${this.port.getInfo().usbProductId} baud:${GT5R_BAUD_RATE} at ${new Date().toISOString()}`);
        this.writer = this.port.writable.getWriter();
        this.reader = this.port.readable.getReader();
        this.buffer = new Uint8Array(0);
      }

      async readBytes(count, timeoutMs = 1500) {
        while (this.buffer.length < count) {
          let timer;
          const timeout = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error('Timed out waiting for the radio to respond.')), timeoutMs); });
          let result;
          try { result = await Promise.race([this.reader.read(), timeout]); } finally { clearTimeout(timer); }
          if (result.done) throw new Error('Serial connection closed unexpectedly.');
          if (result.value && result.value.length) { const merged = new Uint8Array(this.buffer.length + result.value.length); merged.set(this.buffer); merged.set(result.value, this.buffer.length); this.buffer = merged; }
        }
        const bytes = this.buffer.slice(0, count);
        this.buffer = this.buffer.slice(count);
        this.addSerialLogEntry(`Read ${bytes.length} bytes[${Array.from(bytes).map(byte => `0x${byte.toString(16).padStart(2, '0')}`).join(', ')}] at ${new Date().toISOString()}`);
        return bytes;
      }

      async writeBytes(bytes) {
        this.addSerialLogEntry(`Wrote bytes[${bytes.map(byte => `0x${byte.toString(16).padStart(2, '0')}`).join(', ')}] at ${new Date().toISOString()}`);
        for (const byte of bytes) {
          await this.writer.write(new Uint8Array([byte]));
          // chirp had a sleep for the REQUEST_CLONING_MODE_COMMAND
          // but I think it is not needed.
          // await sleep(10);
        }
      }

      addSerialLog(firstEntry) {
        const logContainer = document.querySelector('#serial-logs-container');
        const newLog = document.createElement('div');
        newLog.classList.add('serial-log');
        logContainer.appendChild(newLog);
        this.addSerialLogEntry(firstEntry);

        const logCount = document.querySelectorAll('#serial-logs-container > div').length;
        const serialLogSelect = document.querySelector('#select-serial-log');
        serialLogSelect.innerHTML = Array.from({ length: logCount }, (_, i) => `<option value="${i}">${i}</option>`).join('');
        serialLogSelect.value = logCount - 1;
        showSerialLog(logCount - 1);
      }
      addSerialLogEntry(logEntry){
        const logsContainer = document.querySelector('#serial-logs-container');
        const logContainer = logsContainer.lastElementChild;
        if(!logContainer) return;

        const entryDiv = document.createElement('div');
        entryDiv.textContent = logEntry;
        logContainer.appendChild(entryDiv);
        entryDiv.scrollIntoView();
      }
    }

    async function gt5rDownload(byteReader, onProgress) {
      try {
        let identBytes = null, lastError = null;
        try { identBytes = await gt5rIdent(byteReader); }
        catch (error) { lastError = error; await sleep(500); }
        
        if (!identBytes) throw lastError || new Error('Radio did not respond to identification.');
        
        const chunks = [identBytes];
        for (let addr = 0; addr < 0x1800; addr += 0x40) {
          chunks.push(await gt5rReadBlock(byteReader, addr, 0x40, addr === 0));
          if (onProgress) onProgress(addr + 0x40, 0x1800);
        }
        
        const data = new Uint8Array(chunks.reduce((sum, chunk) => sum + chunk.length, 0));
        let offset = 0;
        for (const chunk of chunks) { data.set(chunk, offset); offset += chunk.length; }
        return data;
      } finally {
        try { await byteReader.reader.cancel(); } catch (error) { /* ignore */ }
        byteReader.reader.releaseLock();
        byteReader.writer.releaseLock();
      }
    }

    const RESPONSE_SUCCESS = 0x06;
    async function gt5rIdent(byteReader) {
      const REQUEST_CLONING_MODE_COMMAND = [0x50, 0xBB, 0xFF, 0x20, 0x12, 0x07, 0x25];
      await byteReader.writeBytes(REQUEST_CLONING_MODE_COMMAND); 

      const ack = await byteReader.readBytes(1, 1500);
      if (ack[0] !== RESPONSE_SUCCESS) throw new Error('Radio did not acknowledge identification (check cable and power-on steps).');

      const REQUEST_STRUCTURE_COMMAND = [0x02];
      await byteReader.writeBytes(REQUEST_STRUCTURE_COMMAND);
      const response = [];

      // Reference: https://github.com/kk7ds/chirp/blob/098f57b2563af7d9411f2f42722947c52d569929/chirp/drivers/uv5r.py#L399
      const RESPONSE_TERMINATOR = 0xDD;
      for (let index = 0; index < 12; index += 1) {
        const byte = await byteReader.readBytes(1, 1500);
        response.push(byte[0]);
        if (byte[0] === RESPONSE_TERMINATOR) break;
      }

      let ident;
      if (response.length === 8) ident = response;
      else if (response.length === 12) ident = [response[0], response[3], response[5], ...response.slice(7)];
      else throw new Error('Unexpected identification response from radio.');

      await byteReader.writeBytes([RESPONSE_SUCCESS]);
      const ack2 = await byteReader.readBytes(1, 1500);
      if (ack2[0] !== RESPONSE_SUCCESS) throw new Error('Radio refused clone.');

      return new Uint8Array(ident);
    }

    async function gt5rReadBlock(byteReader, start, size, firstCommand) {
      await byteReader.writeBytes([0x53, (start >> 8) & 0xff, start & 0xff, size]);
      if (!firstCommand) {
        const ack = await byteReader.readBytes(1, 2000);
        if (ack[0] !== RESPONSE_SUCCESS) throw new Error(`Radio refused to send block 0x${start.toString(16)}`);
      }
      
      const header = await byteReader.readBytes(4, 2000);
      const addr = (header[1] << 8) | header[2];
      if (header[0] !== 0x58 || addr !== start || header[3] !== size) throw new Error(`Unexpected response for block 0x${start.toString(16)}`);

      const chunk = await byteReader.readBytes(size, 2000);
      await byteReader.writeBytes([RESPONSE_SUCCESS]);
      // await sleep(50);
      return chunk;
    }

    function gt5rParseImage(data) {
      const channels = [];
      for (let index = 0; index < GT5R_CHANNEL_COUNT; index += 1) { const memory = gt5rDecodeChannel(data, index); if (memory) channels.push(memory); }
      return channels;
    }

    function gt5rDecodeChannel(data, index) {
      const memOffset = 0x0008 + index * 16;
      const nameOffset = 0x1008 + index * 16;
      const rec = data.subarray(memOffset, memOffset + 16);
      if (rec[0] === 0xff) return null;

      const rxRaw = gt5rLbcd4(rec.subarray(0, 4));
      const txRaw = gt5rLbcd4(rec.subarray(4, 8));
      const isTxInh = rec[4] === 0xff && rec[5] === 0xff && rec[6] === 0xff && rec[7] === 0xff;
      const rxtoneVal = rec[8] | (rec[9] << 8);
      const txtoneVal = rec[10] | (rec[11] << 8);
      const lowpower = rec[14] & 0x03;
      const wide = (rec[15] >> 6) & 0x1;
      const scan = (rec[15] >> 2) & 0x1;

      let duplex = '', offset = 0;
      if (isTxInh) { duplex = 'off'; offset = 0; }
      else if (rxRaw === txRaw) { duplex = ''; offset = 0; }
      else if (Math.abs(rxRaw * 10 - txRaw * 10) > 70000000) { duplex = 'split'; offset = txRaw * 10; }
      else { duplex = rxRaw > txRaw ? '-' : '+'; offset = Math.abs(rxRaw - txRaw) * 10; }

      const pol = ['N', 'N'];
      let txmode = '', rtone = null, dtcsCode = null;
      if (txtoneVal !== 0 && txtoneVal !== 0xffff) {
        if (txtoneVal >= 0x258) { txmode = 'Tone'; rtone = txtoneVal / 10.0; }
        else { txmode = 'DTCS'; const idx = txtoneVal >= 0x6a ? (pol[0] = 'R', txtoneVal - 0x6a) : txtoneVal - 1; dtcsCode = GT5R_DTCS[idx]; }
      }
      let rxmode = '', ctone = null, rxDtcsCode = null;
      if (rxtoneVal !== 0 && rxtoneVal !== 0xffff) {
        if (rxtoneVal >= 0x258) { rxmode = 'Tone'; ctone = rxtoneVal / 10.0; }
        else { rxmode = 'DTCS'; const idx = rxtoneVal >= 0x6a ? (pol[1] = 'R', rxtoneVal - 0x6a) : rxtoneVal - 1; rxDtcsCode = GT5R_DTCS[idx]; }
      }

      let tmode = '', crossMode = 'Tone->Tone';
      if (txmode === 'Tone' && !rxmode) tmode = 'Tone';
      else if (txmode === rxmode && txmode === 'Tone' && rtone === ctone) tmode = 'TSQL';
      else if (txmode === rxmode && txmode === 'DTCS' && dtcsCode === rxDtcsCode) tmode = 'DTCS';
      else if (rxmode || txmode) { tmode = 'Cross'; crossMode = `${txmode}->${rxmode}`; }

      let name = '';
      for (let i = 0; i < 7; i += 1) { const code = data[nameOffset + i]; name += code === 0xff ? ' ' : String.fromCharCode(code); }

      return makeMemory({
        Location: index,
        Name: name.trimEnd(),
        Frequency: gt5rFreq(rxRaw * 10),
        Duplex: duplex,
        Offset: gt5rFreq(offset),
        Tone: tmode,
        rToneFreq: rtone !== null ? rtone.toFixed(1) : '',
        cToneFreq: ctone !== null ? ctone.toFixed(1) : '',
        DtcsCode: dtcsCode !== null ? String(dtcsCode).padStart(3, '0') : '',
        DtcsPolarity: pol.join(''),
        RxDtcsCode: rxDtcsCode !== null ? String(rxDtcsCode).padStart(3, '0') : '',
        CrossMode: crossMode,
        Mode: wide ? 'FM' : 'NFM',
        TStep: '',
        Skip: scan ? '' : 'S',
        Power: lowpower === 1 ? 'Low' : 'High',
        Comment: '',
      });
    }

    function gt5rLbcd4(bytes) { let value = 0; for (let i = 3; i >= 0; i -= 1) value = value * 100 + gt5rBcdByte(bytes[i]); return value; }
    function gt5rBcdByte(byte) { return ((byte >> 4) & 0xf) * 10 + (byte & 0xf); }

    function gt5rFreq(units) { return (units / 1e6).toFixed(6); }

    bindEvents();
    applyTheme();
  </script>
